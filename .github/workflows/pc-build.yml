name: Build Zyvo for PC (Windows / macOS / Linux)

# Builds the same rebranded Zyvo CLI for desktop platforms using the
# upstream cross-compile script (packages/opencode/script/build.ts --single
# per runner). Publishes everything to the pc-v<version> release.

on:
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'Zyvo version to build'
        required: false
        default: '1.17.9'
  push:
    tags:
      - 'pc-v*'

env:
  OPENCODE_VERSION: "1.17.9"
  HOST_BUN_VERSION: "1.3.14"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            package: tar
            flags: '--baseline' 
          - name: linux-arm64
            os: ubuntu-24.04-arm
            package: tar
          - name: darwin-arm64
            os: macos-latest
            package: zip
            flags:  
          - name: darwin-x64
            os: macos-latest
            package: zip
            flags: '--baseline' 
          - name: windows-x64
            os: windows-latest
            package: zip
            flags: '--baseline' 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Override version from input
        if: github.event.inputs.opencode_version
        run: echo "OPENCODE_VERSION=${{ github.event.inputs.opencode_version }}" >> $GITHUB_ENV

      - name: Install Bun (pinned by packages/script)
        shell: bash
        run: |
          HOST_BUN_VERSION="1.3.14"
          curl -fsSL https://bun.sh/install | bash -s "bun-v${HOST_BUN_VERSION}"
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version
          # Windows: cmd.exe children (package postinstalls) need a
          # Windows-style PATH entry — the POSIX form from $HOME is
          # invisible to them ("bun is not recognized")
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$USERPROFILE\.bun\bin" >> $GITHUB_PATH
          else
            echo "$HOME/.bun/bin" >> $GITHUB_PATH
          fi
          # Linux x64 builds compile NATIVELY now (see script/build.ts — bun's
          # linux cross base is musl and dies on stock Ubuntu/Debian), so the
          # --baseline flag needs the HOST bun itself to be the baseline
          # (glibc) build — swap it in, same trick the Windows seed uses.
          # ALSO seed bun's compile-base cache: bun picks the base from
          # ~/.bun/install/cache/bun-<target>-v<version> when it exists and
          # only downloads (a musl build) when missing — issue #2.
          if [ "$RUNNER_OS" = "Linux" ] && [ "$(uname -m)" = "x86_64" ]; then
            curl -fsSL -m 600 "https://github.com/oven-sh/bun/releases/download/bun-v${HOST_BUN_VERSION}/bun-linux-x64-baseline.zip" -o /tmp/bl.zip
            unzip -oq /tmp/bl.zip -d /tmp/bl
            BASE=$(find /tmp/bl -name bun -type f | head -1)
            cp "$BASE" "$HOME/.bun/bin/bun"
            chmod +x "$HOME/.bun/bin/bun"
            mkdir -p "$HOME/.bun/install/cache"
            cp "$BASE" "$HOME/.bun/install/cache/bun-linux-x64-baseline-v${HOST_BUN_VERSION}"
            chmod +x "$HOME/.bun/install/cache/bun-linux-x64-baseline-v${HOST_BUN_VERSION}"
          fi
          # arm64: seed the plain base too (the packaged arm64 binary embeds it).
          # bun's release asset is named -aarch64 but the compile target/cache
          # name is -arm64.
          if [ "$RUNNER_OS" = "Linux" ] && [ "$(uname -m)" = "aarch64" ]; then
            curl -fsSL -m 600 "https://github.com/oven-sh/bun/releases/download/bun-v${HOST_BUN_VERSION}/bun-linux-aarch64.zip" -o /tmp/bl64.zip
            unzip -oq /tmp/bl64.zip -d /tmp/bl64
            BASE64=$(find /tmp/bl64 -name bun -type f | head -1)
            mkdir -p "$HOME/.bun/install/cache"
            cp "$BASE64" "$HOME/.bun/install/cache/bun-linux-arm64-v${HOST_BUN_VERSION}"
            chmod +x "$HOME/.bun/install/cache/bun-linux-arm64-v${HOST_BUN_VERSION}"
          fi
          bun --version

      - name: Install dependencies
        shell: bash
        run: |
          bun install || { sleep 10; bun install; }

      - name: Disable Defender real-time monitoring (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Pre-seed bun baseline binary into cache (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # bun's own downloader keeps failing to extract the baseline compile
          # base on Windows runners ("The download may be incomplete").
          # GROUND TRUTH (verified with a real local compile): bun expects a
          # RAW EXECUTABLE FILE — not a folder — at
          #   ~/.bun/install/cache/bun-windows-x64-baseline-v<version>
          # Seed that exact file from the official GitHub release zip so the
          # build never touches bun's flaky download path.
          CACHE="$HOME/.bun/install/cache/bun-windows-x64-baseline-v${HOST_BUN_VERSION}"
          if [ ! -s "$CACHE" ]; then
            mkdir -p "$HOME/.bun/install/cache" /tmp/baseline
            curl -fsSL -m 600 "https://github.com/oven-sh/bun/releases/download/bun-v${HOST_BUN_VERSION}/bun-windows-x64-baseline.zip" -o /tmp/baseline/baseline.zip
            unzip -oq /tmp/baseline/baseline.zip -d /tmp/baseline
            find /tmp/baseline -name bun.exe -exec cp {} "$CACHE" \;
            chmod +x "$CACHE"
            "$CACHE" --version
            echo ">>> baseline bun seeded: $CACHE"
          fi

      - name: Build (single target, native)
        shell: bash
        working-directory: packages/opencode
        run: |
          bun run script/build.ts --single ${{ matrix.flags }} --skip-embed-web-ui

      - name: Verify ELF interpreter (linux)
        if: runner.os == 'Linux'
        working-directory: packages/opencode/dist
        shell: bash
        run: |
          set -e
          for f in */bin/opencode; do
            echo "$f -> $(readelf -l "$f" 2>/dev/null | grep -o 'Interpreter: .*' || echo 'static/no-interp')"
          done
          # the packaged binaries must be glibc — musl breaks stock
          # Ubuntu/Debian with "Check the interpreter or linker?" (issue #2)
          if [ -f "opencode-linux-x64-baseline/bin/opencode" ]; then
            readelf -l "opencode-linux-x64-baseline/bin/opencode" | grep -q "ld-linux-x86-64" || { echo "::error::linux-x64 baseline binary is musl, not glibc"; exit 1; }
          fi
          if [ -f "opencode-linux-arm64/bin/opencode" ]; then
            readelf -l "opencode-linux-arm64/bin/opencode" | grep -q "ld-linux-aarch64" || { echo "::error::linux-arm64 binary is musl, not glibc"; exit 1; }
          fi
          echo "ELF check passed: glibc"

      - name: Package (rename to zyvo)
        shell: bash
        working-directory: packages/opencode/dist
        run: |
          set -e
          VERSION="${OPENCODE_VERSION}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            DIR=""
            for d in */bin; do
              [ -d "$d" ] || continue
              [ -z "$DIR" ] && DIR="$d"
              case "$d" in *baseline*) DIR="$d"; break ;; esac
            done
            DIR="${DIR%/bin}"
            mv "$DIR/bin/opencode.exe" "$DIR/bin/zyvo.exe"
            # Defender can hold the fresh exe locked mid-scan and make
            # Compress-Archive fail with PermissionDenied — the Write-Error
            # is NON-terminating (exit 0), so -ErrorAction Stop is required
            # for the retry loop to actually retry
            for i in 1 2 3 4 5; do
              powershell -NoProfile -Command "Compress-Archive -Path '$DIR/bin/*' -DestinationPath 'zyvo-${VERSION}-windows-x64.zip' -Force -ErrorAction Stop" && break
              echo "Compress-Archive locked (attempt $i) - retrying in 15s"
              sleep 15
            done
            [ -f "zyvo-${VERSION}-windows-x64.zip" ] || { echo "zip was never created"; exit 1; }
          else
            # Pick the GLIBC baseline explicitly: prefer plain baseline over
            # baseline-musl (glob order puts musl first, and the case *baseline*
            # would pick it). The ELF verify step already validated the plain
            # baseline is glibc, so we use that exact dir name.
            if [ "${{ matrix.name }}" = "linux-x64" ]; then
              DIR="opencode-linux-x64-baseline"
            elif [ "${{ matrix.name }}" = "linux-arm64" ]; then
              DIR="opencode-linux-arm64"
            else
              DIR=""
              for d in */bin; do
                [ -d "$d" ] || continue
                [ -z "$DIR" ] && DIR="$d"
                case "$d" in *baseline*) DIR="$d"; break ;; esac
              done
            fi
            DIR="${DIR%/bin}"
            mv "$DIR/bin/opencode" "$DIR/bin/zyvo" 2>/dev/null || true
            if [ "${{ matrix.package }}" = "tar" ]; then
              tar -czf "zyvo-${VERSION}-${{ matrix.name }}.tar.gz" -C "$DIR/bin" zyvo
            else
              zip -q "zyvo-${VERSION}-${{ matrix.name }}.zip" "$DIR/bin/zyvo"
            fi
          fi
          ls -lh zyvo-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyvo-${{ matrix.name }}
          path: packages/opencode/dist/zyvo-*

  release:
    name: Publish PC release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets

      - name: List assets
        run: ls -lh assets/

      - name: Create/update PC release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v${{ env.OPENCODE_VERSION }}
          files: assets/*
          overwrite_files: true
          body: |
            ## Zyvo ${{ env.OPENCODE_VERSION }} for desktop

            Same Zyvo experience on your computer.

            **Windows — one-line install** (PowerShell):
            ```
            Set-ExecutionPolicy Bypass -Scope Process -Force; iwr https://raw.githubusercontent.com/zyvo9/ZYVO-AI/main/install-zyvo-windows.ps1 -UseBasicParsing | iex
            ```

            Manual:
            - Windows: download `zyvo-*-windows-x64.zip`, extract, run `zyvo.exe`
            - Linux: download .tar.gz, extract, run `./zyvo`
            - macOS: download .zip, extract, run `./zyvo` (allow in Gatekeeper if asked)

            Config lives in `~/.config/zyvo/zyvo.json` (same model list as mobile).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
